name: Build SqMusic main image

on:
  push:
    branches:
      - fix/qq-search-transient-failure
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.main
          push: true
          tags: ghcr.io/longlxx88-gif/simple_sq_music_plus:qq-search-fix-44210d4
