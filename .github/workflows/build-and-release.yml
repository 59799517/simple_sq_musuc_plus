name: Java CI with Maven and Multi-Arch Release

on:
  push:
    branches: [ 3.0 ]

permissions:
  contents: write
  packages: write

env:
  DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
  DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.16.2/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cd src/main/resources && yq e '.version' application.yml)
          WEBVERSION=$(cd src/main/resources && yq e '.webversion' application.yml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "webversion=$WEBVERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "WEB_VERSION=$WEBVERSION" >> $GITHUB_ENV
          echo "APP_VERSION: $VERSION"
          echo "WEB_VERSION: $WEBVERSION"
          echo "$VERSION" > version.txt
          echo "$WEBVERSION" > webversion.txt

      - name: Push changes
        continue-on-error: true
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Build with Maven
        run: |
          mvn -B package -T 4 --file pom.xml -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: |
            target/*.jar
            version.txt
            webversion.txt
            docker-compose.yml
            docker-compose-arm.yml

  build-multi-arch-images:
    name: Build and Push Multi-Arch Docker Images
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            tag_suffix: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cat version.txt 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to Aliyun
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.APP_VERSION }}-${{ matrix.tag_suffix }}
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest-${{ matrix.tag_suffix }}
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.APP_VERSION }}
            org.opencontainers.image.architecture=${{ matrix.platform }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Docker Image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.APP_VERSION }}-${{ matrix.tag_suffix }}
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest-${{ matrix.tag_suffix }}
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.APP_VERSION }}
            org.opencontainers.image.architecture=${{ matrix.platform }}
          provenance: false

  create-manifest-list:
    name: Create Manifest Lists
    needs: build-multi-arch-images
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact

      - name: Read Version from Artifact
        id: read_version
        run: |
          VERSION=$(cat version.txt)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx imagetools create 在 registry 端直接合成 manifest list，
      # 不下载任何镜像层 blob（替代原来的 docker pull + manifest create 老三样）
      # 一次 create 只能用一组源镜像，因此版本 tag 和 latest tag 分两条命令，
      # 版本 manifest 由 v版本-arch 合成，latest manifest 由 latest-arch 合成
      - name: Create and Push Manifest List for Aliyun
        run: |
          # 版本 tag：由 v版本-arch 两个源合成
          docker buildx imagetools create \
            -t registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.APP_VERSION }} \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.APP_VERSION }}-amd64 \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.APP_VERSION }}-arm64

          # latest tag：由 latest-arch 两个源合成
          docker buildx imagetools create \
            -t registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest-amd64 \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest-arm64

      - name: Verify Aliyun Manifest List
        run: |
          echo "=== v${{ env.APP_VERSION }} ==="
          docker buildx imagetools inspect \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.APP_VERSION }}

          echo "=== latest ==="
          docker buildx imagetools inspect \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest

      - name: Create and Push Manifest List for GitHub Packages
        run: |
          # 版本 tag：由 v版本-arch 两个源合成
          docker buildx imagetools create \
            -t ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.APP_VERSION }} \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.APP_VERSION }}-amd64 \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.APP_VERSION }}-arm64

          # latest tag：由 latest-arch 两个源合成
          docker buildx imagetools create \
            -t ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest-amd64 \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest-arm64

      - name: Verify GHCR Manifest List
        run: |
          echo "=== v${{ env.APP_VERSION }} ==="
          docker buildx imagetools inspect \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.APP_VERSION }}

          echo "=== latest ==="
          docker buildx imagetools inspect \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest

  release:
    needs: [build, create-manifest-list]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/3.0' }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact

      - name: Display structure of downloaded files
        run: ls -R

      - name: Read Version from Artifact
        id: app_version
        run: |
          VERSION=$(cat version.txt)
          WEBVERSION=$(cat webversion.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "webversion=$WEBVERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION: $VERSION"
          echo "WEB_VERSION: $WEBVERSION"

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.app_version.outputs.version }}"
          ASSET_PATH="./target/simple_sq_music_plus.jar"
          ASSET_NAME="simple_sq_music_plus-$TAG.jar"

          echo "Removing existing release/tag: $TAG (to overwrite)"
          gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null && gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          {
            echo "## Release ${{ steps.app_version.outputs.version }} - Multi-Architecture Support"
            echo ""
            echo "This release includes Docker images for multiple architectures:"
            echo ""
            echo "### Docker Images Available:"
            echo ""
            echo "**阿里云镜像仓库:**"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}\` (Multi-arch manifest)"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}-amd64\`"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}-arm64\`"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest\` (Multi-arch manifest)"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest-amd64\`"
            echo "- \`registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:latest-arm64\`"
            echo ""
            echo "**GitHub Packages:**"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}\` (Multi-arch manifest)"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}-amd64\`"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ steps.app_version.outputs.version }}-arm64\`"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest\` (Multi-arch manifest)"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest-amd64\`"
            echo "- \`ghcr.io/${{ github.actor }}/simple_sq_music_plus:latest-arm64\`"
            echo ""
            echo "### Supported Architectures:"
            echo "- **AMD64**: Intel/AMD x86-64 processors"
            echo "- **ARM64**: Raspberry Pi 4, AWS Graviton, Apple Silicon"
          } > /tmp/release-notes.md

          echo "Creating release: $TAG"
          gh release create "$TAG" \
            "$ASSET_PATH#$ASSET_NAME" \
            --title "Release $TAG (Multi-Arch)" \
            --notes-file /tmp/release-notes.md \
            --repo ${{ github.repository }}
